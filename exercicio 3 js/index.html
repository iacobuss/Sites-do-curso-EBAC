<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Subtração</title>
</head>
<body>
    <div class="container">
        <h1>Subtração de Numeros</h1>
        <h2>Preencha os dados de forma correta</h2>
        <form id="form-subtracao">
            <label for="valor-maior">Digite o Maior valor para Subtração</label>
            <input id="valor-maior" type="number" name="valor-maior" placeholder="1000">
            <label for="valor-menor">Digite o Menor valor para Subtração</label>
            <input id="valor-menor" type="number" name="valor-menor" placeholder="100">
            <button type="submit">Realize a Subtração</button>
            <p id="resultado"></p>
        </form>
    </div>
    <script src="main.js"></script>
</body>
</html>
