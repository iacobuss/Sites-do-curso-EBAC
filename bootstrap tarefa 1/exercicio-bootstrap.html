<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
  >
</head>
<body>

  <!-- .container centraliza o conteúdo e dá margens nas laterais -->
  <div class="container mt-5" style="max-width: 500px;">

    <h2 class="mb-4">Formulário de Cadastro</h2>

    <form>
      <!-- .mb-3 = margin-bottom (espaçamento entre os campos) -->
      <div class="mb-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
      </div>

      <div class="mb-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="telefone" placeholder="(45) 9 9999-9999">
      </div>

      <button type="submit" class="btn btn-primary">Enviar</button>
    </form>

  </div>
  
</body>
</html>
